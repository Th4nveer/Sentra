services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8050:8050"
    env_file:
      - .env
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend/data:/app/data

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:8050
