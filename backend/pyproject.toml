[project]
name = "sentra-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "groq>=0.12.0",
    "PyMuPDF>=1.24.0",
    "pytesseract>=0.3.10",
    "python-multipart>=0.0.9",
]

[tool.vercel]
entrypoint = "src.api.app:app"
